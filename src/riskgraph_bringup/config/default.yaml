# Default RiskGraph-Go2 parameters.
# Loaded by both demo_offline.launch.py and integration.launch.py.
#
# `store_path` MUST be the same string for `riskgraph_memory` and `riskgraph_planner`
# (and `riskgraph_explainer` if running). They open the same SQLite file: the memory
# node writes, the planner/explainer read. SQLite WAL mode (set automatically by
# riskgraph_core.RiskStore) makes that safe.
#
# /tmp is launch-scoped enough for the demo and survives the short stack lifetime.
# For Jetson production, override to a persistent NVMe path — see docs/hardware_integration.md.

riskgraph_memory:
  ros__parameters:
    store_path: "/tmp/riskgraph_store.sqlite"
    decay_half_life_s: 1800.0   # 30 min, older events fade
    # Absolute path to a segment-seed JSON/YAML file. Empty string disables
    # seeding (events without an emitter-stamped segment_id get stored unbound).
    # See the "Seed known route segments" section of README.md and the sample
    # under src/riskgraph_bringup/config/segment_seeds/.
    #
    # The seed's `frame_id` must equal the frame the adapters stamp events in
    # (the Go2's odometry frame, "odom"). Events in any other frame are stored
    # unbound rather than joined across frames.
    segment_seed_path: ""

riskgraph_planner:
  ros__parameters:
    store_path: "/tmp/riskgraph_store.sqlite"
    weight_geometry: 1.0
    weight_semantic: 1.0
    weight_risk: 4.0
    decay_half_life_s: 1800.0

riskgraph_explainer:
  ros__parameters:
    store_path: "/tmp/riskgraph_store.sqlite"
    input_topic: "/riskgraph/route_scores"
    output_topic: "/riskgraph/explanations"

riskgraph_safety_adapter:
  ros__parameters:
    input_topic: "/go2/safety_alert"
    output_topic: "/riskgraph/risk_events"
    # Pose source. Adapters stamp each RiskEvent with the robot position from
    # this topic; an event with no odometry newer than `pose_max_age_s` is
    # published unposed (blank frame_id) and the memory node stores it without
    # a segment instead of guessing one. Set odom_topic to "" to declare that
    # this deployment has no odometry at all.
    odom_topic: "/utlidar/robot_odom"   # nav_msgs/Odometry, ~150 Hz, frame "odom"
    pose_max_age_s: 0.5

riskgraph_helix_adapter:
  ros__parameters:
    input_topic: "/helix/faults"
    output_topic: "/riskgraph/risk_events"
    # Pose source. Adapters stamp each RiskEvent with the robot position from
    # this topic; an event with no odometry newer than `pose_max_age_s` is
    # published unposed (blank frame_id) and the memory node stores it without
    # a segment instead of guessing one. Set odom_topic to "" to declare that
    # this deployment has no odometry at all.
    odom_topic: "/utlidar/robot_odom"   # nav_msgs/Odometry, ~150 Hz, frame "odom"
    pose_max_age_s: 0.5

riskgraph_tactile_adapter:
  ros__parameters:
    input_topic: "/tactile/slip_state"
    output_topic: "/riskgraph/risk_events"
    severity: 0.7
    # Pose source. Adapters stamp each RiskEvent with the robot position from
    # this topic; an event with no odometry newer than `pose_max_age_s` is
    # published unposed (blank frame_id) and the memory node stores it without
    # a segment instead of guessing one. Set odom_topic to "" to declare that
    # this deployment has no odometry at all.
    odom_topic: "/utlidar/robot_odom"   # nav_msgs/Odometry, ~150 Hz, frame "odom"
    pose_max_age_s: 0.5
